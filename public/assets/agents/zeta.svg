<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="zeta-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="zeta-glow" cx="64" cy="64" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Glow -->
  <circle cx="64" cy="64" r="56" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="url(#zeta-glow)"/>

  <!-- Tactical Shield / Intel Crest -->
  <path d="M 64,18 L 100,32 L 100,70 C 100,92 64,108 64,108 C 64,108 28,92 28,70 L 28,32 Z" stroke="url(#zeta-grad)" stroke-width="2.5" stroke-linejoin="round" fill="rgba(244, 63, 94, 0.08)"/>

  <!-- Inner Recon Reticle -->
  <circle cx="64" cy="60" r="16" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="64" cy="60" r="6" fill="url(#zeta-grad)"/>

  <!-- Crosshairs -->
  <line x1="64" y1="38" x2="64" y2="48" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="72" x2="64" y2="82" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="60" x2="52" y2="60" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="60" x2="86" y2="60" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"/>
</svg>
