<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="muse-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="muse-glow" cx="64" cy="64" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Glow -->
  <circle cx="64" cy="64" r="56" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="url(#muse-glow)"/>

  <!-- Outer Viewfinder / Aperture Frame (9:16 vertical crop emphasis) -->
  <rect x="36" y="20" width="56" height="88" rx="8" stroke="url(#muse-grad)" stroke-width="2.5" fill="rgba(139, 92, 246, 0.08)"/>

  <!-- Aperture Corner Marks -->
  <path d="M 28,34 L 28,24 L 38,24" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100,34 L 100,24 L 90,24" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 28,94 L 28,104 L 38,104" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100,94 L 100,104 L 90,104" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

  <!-- Play / Media Waveform Vector -->
  <polygon points="54,48 78,64 54,80" fill="url(#muse-grad)" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Creative Spark / Hook Lightning -->
  <path d="M 64,30 L 66,38 L 74,40 L 66,42 L 64,50 L 62,42 L 54,40 L 62,38 Z" fill="#a78bfa"/>
</svg>
