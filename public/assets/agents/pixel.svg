<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="pixel-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="pixel-glow" cx="64" cy="64" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Glow -->
  <circle cx="64" cy="64" r="56" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="url(#pixel-glow)"/>

  <!-- High-Speed Distribution Ring -->
  <circle cx="64" cy="64" r="44" stroke="url(#pixel-grad)" stroke-width="2.5" stroke-dasharray="16 8" stroke-linecap="round" fill="rgba(6, 182, 212, 0.08)"/>

  <!-- Central Automation Packet / Hub Node -->
  <rect x="52" y="52" width="24" height="24" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <rect x="58" y="58" width="12" height="12" rx="2" fill="url(#pixel-grad)"/>

  <!-- Tri-Platform Distribution Radiators (YouTube Shorts, TikTok, IG Reels) -->
  <!-- Top: YouTube -->
  <line x1="64" y1="52" x2="64" y2="28" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="24" r="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="64" cy="24" r="2.5" fill="#22d3ee"/>

  <!-- Bottom Right: TikTok -->
  <line x1="72" y1="72" x2="90" y2="90" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <circle cx="94" cy="94" r="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="94" cy="94" r="2.5" fill="#22d3ee"/>

  <!-- Bottom Left: IG Reels -->
  <line x1="56" y1="72" x2="38" y2="90" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <circle cx="34" cy="94" r="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="34" cy="94" r="2.5" fill="#22d3ee"/>
</svg>
