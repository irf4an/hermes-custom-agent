<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="atlas-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="atlas-glow" cx="64" cy="64" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="atlas-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background Base & Glow -->
  <circle cx="64" cy="64" r="56" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="url(#atlas-glow)"/>

  <!-- Outer Command Hexagon Ring -->
  <polygon points="64,16 104,39 104,89 64,112 24,89 24,39" stroke="url(#atlas-grad)" stroke-width="2.5" stroke-linejoin="round" fill="rgba(245, 158, 11, 0.08)"/>

  <!-- Inner Coordination Lattice -->
  <polygon points="64,28 92,44 92,84 64,100 36,84 36,44" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3" fill="none" opacity="0.6"/>

  <!-- Central Nexus Core -->
  <circle cx="64" cy="64" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="7" fill="url(#atlas-grad)"/>

  <!-- Command Radial Beams to Sub-Nodes -->
  <line x1="64" y1="28" x2="64" y2="50" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="78" x2="64" y2="100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="44" x2="52" y2="57" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="44" x2="76" y2="57" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="84" x2="52" y2="71" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="84" x2="76" y2="71" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Vertex Sensor Points -->
  <circle cx="64" cy="16" r="3" fill="#fbbf24"/>
  <circle cx="104" cy="39" r="3" fill="#fbbf24"/>
  <circle cx="104" cy="89" r="3" fill="#fbbf24"/>
  <circle cx="64" cy="112" r="3" fill="#fbbf24"/>
  <circle cx="24" cy="89" r="3" fill="#fbbf24"/>
  <circle cx="24" cy="39" r="3" fill="#fbbf24"/>
</svg>
