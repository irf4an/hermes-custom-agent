    <rect width="180" height="80" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="14" y="24" fill="#c4b5fd" font-size="9" font-weight="700">SHARED WORK STATE</text>
    <text x="14" y="45" fill="#f8fafc" font-size="13" font-weight="700">SQLite Kanban</text>
    <text x="14" y="60" fill="#94a3b8" font-size="8.5">~/.hermes/kanban.db</text>
    <text x="14" y="71" fill="#a78bfa" font-size="8">Task Pipeline Coordination</text>
  </g>

  <!-- OBSIDIAN VAULT -->
  <g transform="translate(950, 570)">
    <rect width="180" height="80" rx="6" fill="#0f172a"/>
    <rect width="180" height="80" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#64748b" stroke-width="1.5"/>
    <text x="14" y="24" fill="#94a3b8" font-size="9" font-weight="700">KNOWLEDGE BASE</text>
    <text x="14" y="45" fill="#f8fafc" font-size="13" font-weight="700">Obsidian Vault</text>
    <text x="14" y="60" fill="#94a3b8" font-size="8.5">/root/notes</text>
    <text x="14" y="71" fill="#64748b" font-size="8">Git Sync → GitHub Repo</text>
  </g>

  <!-- LEGEND (Bottom bar outside boundaries) -->
  <g transform="translate(50, 755)">
    <rect width="1100" height="45" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Legend Items -->
