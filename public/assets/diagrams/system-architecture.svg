    <text x="14" y="45" fill="#f8fafc" font-size="13" font-weight="700">Sultan Ops Deck</text>
    <text x="14" y="60" fill="#94a3b8" font-size="8.5">Express • PM2 Managed</text>
    <text x="14" y="71" fill="#38bdf8" font-size="8">Kanban &amp; Vault APIs</text>
  </g>

