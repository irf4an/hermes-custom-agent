    <rect width="170" height="80" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="14" y="24" fill="#22d3ee" font-size="8" font-weight="700">DISTRIBUTION TARGETS</text>
