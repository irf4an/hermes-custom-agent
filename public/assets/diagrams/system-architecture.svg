    <text x="14" y="58" fill="#94a3b8" font-size="8.5">Port 20128 • Low Memory</text>
    <text x="14" y="69" fill="#34d399" font-size="8">Model Failover &amp; Routing</text>
  </g>

  <!-- NODES: LAYER 3 - SUB-AGENTS PIPELINE (X: 610, W: 250) -->
  <!-- VERA -->
  <g transform="translate(610, 150)">
    <rect width="250" height="80" rx="6" fill="#0f172a"/>
    <rect width="250" height="80" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#10b981" stroke-width="2"/>
    <circle cx="230" cy="20" r="4" fill="#10b981"/>
    <text x="14" y="24" fill="#34d399" font-size="9" font-weight="700">REVENUE &amp; AFFILIATE STRATEGIST</text>
    <text x="14" y="45" fill="#f8fafc" font-size="14" font-weight="800">VERA</text>
    <text x="14" y="60" fill="#94a3b8" font-size="8.5">Offer Research • Unit Economics</text>
    <text x="14" y="71" fill="#34d399" font-size="8">Campaign Briefing → MUSE</text>
  </g>

  <!-- MUSE -->
  <g transform="translate(610, 300)">
    <rect width="250" height="80" rx="6" fill="#0f172a"/>
    <rect width="250" height="80" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="230" cy="20" r="4" fill="#8b5cf6"/>
    <text x="14" y="24" fill="#a78bfa" font-size="9" font-weight="700">CONTENT PRODUCER &amp; CLIPPER</text>
    <text x="14" y="45" fill="#f8fafc" font-size="14" font-weight="800">MUSE</text>
    <text x="14" y="60" fill="#94a3b8" font-size="8.5">yt-dlp • ffmpeg • 9:16 Video Cuts</text>
    <text x="14" y="71" fill="#a78bfa" font-size="8">Viral Hooks &amp; Burned-in Subtitles</text>
  </g>

  <!-- PIXEL -->
