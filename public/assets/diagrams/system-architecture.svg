    <rect width="250" height="80" rx="6" fill="#0f172a"/>
    <rect width="250" height="80" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="230" cy="20" r="4" fill="#06b6d4"/>
    <text x="14" y="24" fill="#22d3ee" font-size="9" font-weight="700">DISTRIBUTION &amp; AUTOMATION</text>
    <text x="14" y="45" fill="#f8fafc" font-size="14" font-weight="800">PIXEL</text>
    <text x="14" y="60" fill="#94a3b8" font-size="8.5">Auto-Upload • Queue Scheduling</text>
    <text x="14" y="71" fill="#22d3ee" font-size="8">Verification &amp; Analytics Pull</text>
