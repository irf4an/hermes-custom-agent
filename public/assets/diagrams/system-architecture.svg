    <rect width="170" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="24" fill="#fbbf24" font-size="8" font-weight="700">OPERATOR BROWSER</text>
    <text x="14" y="42" fill="#f8fafc" font-size="12" font-weight="700">Mission Control</text>
    <text x="14" y="52" fill="#94a3b8" font-size="8">Port :3000 Web UI</text>
  </g>

  <!-- Social Video Platforms -->
