    <text x="42" y="26" fill="#94a3b8" font-size="9">ATLAS (Orchestration)</text>

    <circle cx="210" cy="22" r="5" fill="#10b981"/>
    <text x="222" y="26" fill="#94a3b8" font-size="9">VERA (Revenue)</text>

    <circle cx="350" cy="22" r="5" fill="#8b5cf6"/>
    <text x="362" y="26" fill="#94a3b8" font-size="9">MUSE (Production)</text>

    <circle cx="490" cy="22" r="5" fill="#06b6d4"/>
    <text x="502" y="26" fill="#94a3b8" font-size="9">PIXEL (Distribution)</text>

    <circle cx="640" cy="22" r="5" fill="#38bdf8"/>
    <text x="652" y="26" fill="#94a3b8" font-size="9">Edge / Web Gateways</text>

    <line x1="820" y1="22" x2="850" y2="22" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="860" y="26" fill="#94a3b8" font-size="9">Analytics Feedback Loop</text>
  </g>
