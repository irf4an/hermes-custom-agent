<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500" width="1150" height="500" fill="none" style="background:#020617; font-family:'JetBrains Mono', monospace;">
  <defs>
    <pattern id="flow-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="flow-arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="flow-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="flow-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="flow-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#flow-grid)"/>

  <!-- TITLE -->
  <text x="40" y="45" fill="#f8fafc" font-size="18" font-weight="700">AUTONOMOUS INCOME PIPELINE — 6-STEP CYCLE</text>
  <text x="40" y="66" fill="#64748b" font-size="10">END-TO-END SPECIFICATION: RESEARCH → BRIEF → CLIP → DISTRIBUTE → VERIFY → CONVERT</text>

  <!-- CONNECTORS -->
  <!-- 1 -> 2 -->
  <path d="M 200,200 L 240,200" stroke="#10b981" stroke-width="2" marker-end="url(#flow-arrow-emerald)"/>
  <!-- 2 -> 3 -->
  <path d="M 410,200 L 450,200" stroke="#f59e0b" stroke-width="2" marker-end="url(#flow-arrow-amber)"/>
  <!-- 3 -> 4 -->
  <path d="M 620,200 L 660,200" stroke="#8b5cf6" stroke-width="2" marker-end="url(#flow-arrow-violet)"/>
  <!-- 4 -> 5 -->
  <path d="M 830,200 L 870,200" stroke="#06b6d4" stroke-width="2" marker-end="url(#flow-arrow-cyan)"/>
  <!-- 5 -> 6 (Feedback Loop returning to VERA) -->
  <path d="M 955,270 L 955,380 L 115,380 L 115,270" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flow-arrow-emerald)"/>
  <text x="535" y="370" fill="#34d399" font-size="9" text-anchor="middle" font-weight="700">FEEDBACK LOOP: ANALYTICS &amp; CONVERSION DATA TO VERA (KILL UNCONVERTED / SCALE WINNERS)</text>

  <!-- STEP 1: VERA -->
  <g transform="translate(30, 130)">
    <rect width="170" height="140" rx="8" fill="#0f172a"/>
    <rect width="170" height="140" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#10b981" stroke-width="2"/>
    <rect x="12" y="12" width="22" height="22" rx="4" fill="#047857"/>
    <text x="23" y="27" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="42" y="27" fill="#34d399" font-size="9" font-weight="700">VERA</text>
    <text x="12" y="55" fill="#f8fafc" font-size="11" font-weight="700">Offer Research</text>
    <text x="12" y="72" fill="#94a3b8" font-size="8.5">• SaaS &amp; Affiliate Scrape</text>
    <text x="12" y="86" fill="#94a3b8" font-size="8.5">• Unit Economics Model</text>
    <text x="12" y="100" fill="#94a3b8" font-size="8.5">• Campaign Brief Spec</text>
    <text x="12" y="122" fill="#34d399" font-size="8" font-weight="700">Output: Campaign Brief</text>
  </g>

  <!-- STEP 2: ATLAS -->
  <g transform="translate(240, 130)">
    <rect width="170" height="140" rx="8" fill="#0f172a"/>
    <rect width="170" height="140" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="12" y="12" width="22" height="22" rx="4" fill="#b45309"/>
    <text x="23" y="27" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="42" y="27" fill="#fbbf24" font-size="9" font-weight="700">ATLAS</text>
    <text x="12" y="55" fill="#f8fafc" font-size="11" font-weight="700">Kanban Dispatch</text>
    <text x="12" y="72" fill="#94a3b8" font-size="8.5">• Pipeline Decomposition</text>
    <text x="12" y="86" fill="#94a3b8" font-size="8.5">• Task Creation &amp; Locks</text>
    <text x="12" y="100" fill="#94a3b8" font-size="8.5">• SLA &amp; Retry Routing</text>
    <text x="12" y="122" fill="#fbbf24" font-size="8" font-weight="700">Output: Kanban Tickets</text>
  </g>

  <!-- STEP 3: MUSE -->
  <g transform="translate(450, 130)">
    <rect width="170" height="140" rx="8" fill="#0f172a"/>
    <rect width="170" height="140" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="12" y="12" width="22" height="22" rx="4" fill="#6d28d9"/>
    <text x="23" y="27" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">3</text>
    <text x="42" y="27" fill="#a78bfa" font-size="9" font-weight="700">MUSE</text>
    <text x="12" y="55" fill="#f8fafc" font-size="11" font-weight="700">Clip Production</text>
    <text x="12" y="72" fill="#94a3b8" font-size="8.5">• yt-dlp Licensed Ingest</text>
    <text x="12" y="86" fill="#94a3b8" font-size="8.5">• ffmpeg 9:16 Vertical</text>
    <text x="12" y="100" fill="#94a3b8" font-size="8.5">• Hook &amp; Burned Subtitles</text>
    <text x="12" y="122" fill="#a78bfa" font-size="8" font-weight="700">Output: MP4 + Metadata</text>
  </g>

  <!-- STEP 4: PIXEL -->
  <g transform="translate(660, 130)">
    <rect width="170" height="140" rx="8" fill="#0f172a"/>
    <rect width="170" height="140" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#06b6d4" stroke-width="2"/>
    <rect x="12" y="12" width="22" height="22" rx="4" fill="#0e7490"/>
    <text x="23" y="27" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="42" y="27" fill="#22d3ee" font-size="9" font-weight="700">PIXEL</text>
    <text x="12" y="55" fill="#f8fafc" font-size="11" font-weight="700">Auto-Upload Pipe</text>
    <text x="12" y="72" fill="#94a3b8" font-size="8.5">• Queue &amp; Cadence Timing</text>
    <text x="12" y="86" fill="#94a3b8" font-size="8.5">• YT Shorts / TikTok / IG</text>
    <text x="12" y="100" fill="#94a3b8" font-size="8.5">• Tagging &amp; Disclosure</text>
    <text x="12" y="122" fill="#22d3ee" font-size="8" font-weight="700">Output: Published Posts</text>
  </g>

  <!-- STEP 5: VERIFICATION & AUDIT -->
  <g transform="translate(870, 130)">
    <rect width="170" height="140" rx="8" fill="#0f172a"/>
    <rect width="170" height="140" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="12" y="12" width="22" height="22" rx="4" fill="#0284c7"/>
    <text x="23" y="27" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">5</text>
    <text x="42" y="27" fill="#38bdf8" font-size="9" font-weight="700">VERIFY</text>
    <text x="12" y="55" fill="#f8fafc" font-size="11" font-weight="700">Audit &amp; Telemetry</text>
    <text x="12" y="72" fill="#94a3b8" font-size="8.5">• Read Back Video URL/ID</text>
    <text x="12" y="86" fill="#94a3b8" font-size="8.5">• Verify Disclosure Text</text>
    <text x="12" y="100" fill="#94a3b8" font-size="8.5">• Pull View/Click Metrics</text>
    <text x="12" y="122" fill="#38bdf8" font-size="8" font-weight="700">Output: Verified Proof</text>
  </g>

  <!-- FOOTER -->
  <g transform="translate(30, 440)">
    <rect width="1010" height="36" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#64748b" font-size="9">Autonomous Operations Standard • No manual publish • 100% Verified Telemetry • Zero Hallucination Policy</text>
  </g>
</svg>
